# JIZO CI (owner: P6).
#
# Two gates, both required before a merge:
#   test    - the whole suite against a real Postgres, seeded like the demo
#   secrets - gitleaks + the reviewed detect-secrets baseline
#
# The database is a service container so the P3-backed tests actually run
# instead of skipping. A suite that skips its integration half is not a gate.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (with Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resilient
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resilient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/resilient

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Seed demo data
        run: python -m backend.seed

      - name: Run the suite
        run: python -m pytest -q

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gitleaks is the blocking gate. It scans the working tree (`dir`, not
      # `detect`) so it checks the code as merged, not every historical blob -
      # and it needs no baseline, so nothing can drift between machines.
      # detect-secrets still runs locally via .pre-commit-config.yaml, but its
      # hook rewrites the baseline's line numbers and fails on any drift, which
      # made it unreliable in a clean CI checkout.
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --config .gitleaks.toml
