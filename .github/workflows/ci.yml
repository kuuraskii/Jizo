# JIZO CI (owner: P6).
#
# Two gates, both required before a merge:
#   test    - the whole suite against a real Postgres, seeded like the demo
#   secrets - gitleaks + the reviewed detect-secrets baseline
#
# The database is a service container so the P3-backed tests actually run
# instead of skipping. A suite that skips its integration half is not a gate.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (with Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resilient
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resilient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/resilient

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Seed demo data
        run: python -m backend.seed

      - name: Run the suite
        run: python -m pytest -q

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Runs the same hooks a developer runs locally, so "green in CI" and
      # "green before commit" cannot drift. detect-secrets checks against the
      # reviewed .secrets.baseline; gitleaks uses .gitleaks.toml (which
      # allowlists that baseline, whose hashes it would otherwise flag).
      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: detect-secrets (reviewed baseline)
        run: pre-commit run detect-secrets --all-files

      - name: gitleaks
        run: pre-commit run gitleaks --all-files
