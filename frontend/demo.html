<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIZO · Route Confirm</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #14161b;
    --border: #262b36;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --faint: #64748b;
    --cyan: #00f0ff;
    --green: #00ff66;
    --amber: #ffb800;
    --pink: #ff0055;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    display: flex; justify-content: center; padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 780px; }
  header { margin-bottom: 24px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
  h1 span { color: var(--cyan); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px;
  }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=text] {
    flex: 1; min-width: 180px; background: #0d0f13; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font: inherit; font-size: 14px;
  }
  input[type=text]:focus { outline: none; border-color: var(--cyan); }
  label.check { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  button {
    background: var(--cyan); color: #04121a; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 700; font-size: 14px;
    cursor: pointer; box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
  }
  button:hover { box-shadow: 0 0 22px rgba(0, 240, 255, 0.55); }
  button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  @media (max-width: 640px) { .results { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .card h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px;
    border-radius: 999px; text-transform: uppercase; letter-spacing: 0.6px;
  }
  .badge.live    { color: #04121a; background: var(--green); }
  .badge.cache   { color: #1a1204; background: var(--amber); }
  .badge.default { color: #1a1204; background: var(--amber); }
  .badge.message { color: #fff; background: var(--pink); }
  .badge.none    { color: var(--text); background: #334155; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--faint); font-size: 12px; margin: 10px 0; }
  .meta b { color: var(--muted); font-weight: 600; }
  pre {
    margin: 0; background: #0d0f13; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; font-size: 11.5px; color: #b6c2d2;
    overflow: auto; max-height: 180px;
  }
  .empty { color: var(--faint); font-size: 13px; }
  footer { color: var(--faint); font-size: 12px; margin-top: 18px; }
  code { color: var(--cyan); }
  .banner {
    margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px;
    border: 1px solid var(--border);
  }
  .banner.ok { color: var(--green); border-color: rgba(0,255,102,0.3); }
  .banner.bad { color: var(--amber); border-color: rgba(255,184,0,0.3); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>JIZO <span>· Route Confirm</span></h1>
      <div class="sub">
        The crash-test dummy for the JIZO library. One route confirm fans out to
        weather + geocode through <code>resilient_get()</code>.
      </div>
    </header>

    <div class="panel">
      <div class="controls">
        <input id="address" type="text" value="Delhi" placeholder="Delivery address">
        <label class="check">
          <input id="simulate" type="checkbox"> simulate outage
        </label>
        <button id="go">Confirm route</button>
      </div>
      <div id="banner"></div>
    </div>

    <div class="results" id="results">
      <div class="empty">Enter an address and confirm a route.</div>
    </div>

    <footer>Every answer is labelled with the fallback rung that served it.</footer>
  </div>

<script>
const $ = (id) => document.getElementById(id);

function badge(rung) {
  const cls = ["live", "cache", "default", "message"].includes(rung) ? rung : "none";
  return `<span class="badge ${cls}">${rung}</span>`;
}

function card(key, r) {
  const title = key === "weather" ? "Weather · Open-Meteo" : "Geocode · Nominatim";
  const data = r.data === null || r.data === undefined
    ? '<span class="empty">no payload</span>'
    : `<pre>${JSON.stringify(r.data, null, 2)}</pre>`;
  const breaker = r.breakerState || "—";
  return `
    <div class="card">
      <h2>${title}</h2>
      ${badge(r.servedFrom)}
      <div class="meta">
        <span><b>status</b> ${r.status ?? "—"}</span>
        <span><b>latency</b> ${r.latencyMs}ms</span>
        <span><b>attempts</b> ${r.attempts}</span>
        <span><b>breaker</b> ${breaker}</span>
      </div>
      ${r.note ? `<div class="meta"><span>${r.note}</span></div>` : ""}
      ${data}
    </div>`;
}

async function confirm() {
  const button = $("go");
  button.disabled = true;
  $("banner").innerHTML = "";
  try {
    const params = new URLSearchParams({
      address: $("address").value || "Delhi",
      simulate: $("simulate").checked ? "1" : "0",
    });
    const response = await fetch("/api/confirm?" + params.toString());
    const body = await response.json();
    $("results").innerHTML =
      card("weather", body.results.weather) + card("geocode", body.results.geocode);
    $("banner").innerHTML = body.degraded
      ? `<div class="banner bad">Degraded — a fallback rung answered instead of the live upstream.</div>`
      : `<div class="banner ok">Healthy — both calls served live.</div>`;
  } catch (err) {
    $("banner").innerHTML = `<div class="banner bad">Request failed: ${err}</div>`;
  } finally {
    button.disabled = false;
  }
}

$("go").addEventListener("click", confirm);
$("address").addEventListener("keydown", (e) => { if (e.key === "Enter") confirm(); });
confirm();
</script>
</body>
</html>
